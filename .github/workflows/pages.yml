name: Validate Dash Drive

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Validate data snapshot
        run: npm run validate:data

      - name: Build Astro
        run: npm run build
        env:
          SITE_URL: https://dash-drive.henrico.works

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: dash-drive-dist
          path: dist
          if-no-files-found: error
